# release-plz owns changelogs + per-crate version bumps for this workspace's
# library crates:
#   ios-backup-core, ios-backup-forensic
# It runs on pushes to main (see .github/workflows/release-plz.yml):
#   - `release-pr`  opens a human-reviewed version-bump PR (conventional commits)
#   - `release`     tags a crate whose Cargo.toml version is ahead of crates.io
#
# This file arrived as a copy of dmg-forensic's and still named `dmg-core`,
# `dmg-forensic` and a `dmg-forensic-cli` member that does not exist here. That
# typo is the only reason the first push did not publish: release-plz aborted on
# the unknown override while CARGO_REGISTRY_TOKEN was live in the environment.

[workspace]
# crates.io publishing stays OFF until the pre-publish gate is actually met --
# ADR-0012 wants a fuzz target per parsed structure and this workspace has none,
# and docs/validation.md still records an open validation gap. A publish is a
# one-way door (the name is taken, and the delete window is 72h), so it waits for
# a deliberate decision rather than riding along with the next push to main.
#
# To publish: set this to true, confirm the version, push.
publish = false
# Per-package git tags, e.g. `ios-backup-core-v0.1.1`. `v[0-9]*` binary triggers
# never match these — see the fleet release standard.
git_tag_name = "{{ package }}-v{{ version }}"
git_tag_enable = true
git_release_enable = false
changelog_update = true
dependencies_update = false
# Only prepare a release on a real change. release-plz's detection is file-based, so a
# changelog-only "chore: release" commit otherwise re-triggers a release (the churn
# loop). This allowlist makes feat/fix/perf/refactor/doc/revert the only triggers.
release_commits = "^(feat|fix|perf|refactor|doc|revert)"

[changelog]
commit_parsers = [
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "performance" },
    { message = "^refactor", group = "other" },
    { message = "^doc", group = "documentation" },
    { message = "^revert", group = "other" },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
    { message = "^chore", skip = true },
    { message = "^.*", group = "other" },
]
